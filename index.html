    <!-- Theme -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#147568" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1218" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Boot theme: runs before the first paint (and before the blocking font
      stylesheet below resolves) so the resolved theme already exists on <html>.
      Without it, html.dark is applied by React, so a dark-mode visitor watched
      a light page for several seconds before it snapped to dark.

      This script is the single authority for both decisions. It publishes its
      answers on <html> and the app consumes them instead of resolving the same
      question a second time — ThemeContext and LanguageContext read these, and
      resolve the value themselves only when the attributes are absent:

        data-boot-theme  'dark' | 'light'   resolved theme
        data-boot-lang   'en' | 'es'        resolved language

      Both are written on every run, including when the answer is the default, so
      their absence means exactly one thing: this script did not run. That is why
      the <html> tag carries no data-boot-* attribute of its own — a hardcoded
      default would be indistinguishable from a real answer, and would freeze
      that default in place whenever this script is stripped.

      Storage access is guarded here and in the app (src/storage.ts): reading or
      writing it throws outright when a browser blocks it, and an unguarded throw
      from either end takes the whole app down.
    -->
    <script>
      (function () {
        var el = document.documentElement;
        var stored = null;
        var lang = null;
        try {
          stored = localStorage.getItem('theme');
          lang = localStorage.getItem('language');
        } catch (e) {
          /* storage can throw in private mode; fall back to the media query */
        }
        var fromUrl = new URLSearchParams(location.search).get('lang');
        if (fromUrl === 'en' || fromUrl === 'es') lang = fromUrl;
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        el.classList.toggle('dark', dark);
        el.setAttribute('data-boot-theme', dark ? 'dark' : 'light');
        el.setAttribute('data-boot-lang', lang === 'es' ? 'es' : 'en');

        /*
         * The loader's logo is otherwise discovered only once the style block
         * below is parsed, and then queues behind the bundle and the web fonts:
         * measured on slow 3G it started at 721ms and finished at ~2.9s, so the
         * loader spent most of its life as an unbranded bar on an empty field.
         * Asking for the one variant this theme needs, at high priority, moves
         * it to the front of the queue. The style block still requests it, so
         * the logo renders even if this preload is ignored.
         */
        var preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = dark ? '/images/logo_black.webp' : '/images/logo_white.webp';
        preload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(preload);
      })();
    </script>

    <!--
      Boot loader. Inline on purpose: it has to paint on the first frame, which
      is before src/index.css is on the page. The colour values below duplicate
      design tokens from src/index.css (#f8fafc / #0e1218 surfaces, #147568 /
      #2dd4bf accents) because those variables do not exist yet at this point.
      It is removed by dismissBootLoader() in src/boot.ts once React has
      committed — never by a timer, so it can never add delay of its own.

      Because that is its only removal path, the overlay also carries its own
      last resort: a failure presentation the script at the end of the body
      reveals when the bundle fails to start, and a <noscript> one for a visitor
      whose JavaScript is switched off. Both exist so that the overlay can never
      become a dead end over an empty page.
    -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #f8fafc;
        transition: opacity 280ms cubic-bezier(0.25, 1, 0.5, 1);
      }
      html.dark #boot-loader {
        background: #0e1218;
      }
      #boot-loader .boot-loader__inner {
        display: grid;
        justify-items: center;
        gap: 1.25rem;
      }
      #boot-loader .boot-loader__mark {
        width: min(14rem, 56vw);
        aspect-ratio: 100 / 27;
        background: url('/images/logo_white.webp') center / contain no-repeat;
      }
      html.dark #boot-loader .boot-loader__mark {
        background-image: url('/images/logo_black.webp');
      }
      #boot-loader .boot-loader__bar {
        width: min(14rem, 56vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(20, 117, 104, 0.16);
        overflow: hidden;
      }
      html.dark #boot-loader .boot-loader__bar {
        background: rgba(45, 212, 191, 0.18);
      }
      #boot-loader .boot-loader__bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 38%;
        border-radius: inherit;
        background: #147568;
        animation: boot-loader-slide 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      html.dark #boot-loader .boot-loader__bar::after {
        background: #2dd4bf;
      }
      @keyframes boot-loader-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(265%);
        }
      }
      /* Screen-reader-only label. index.css is not on the page yet, so its
         .visually-hidden helper (there isn't one) cannot be reused here. */
      #boot-loader .boot-loader__label {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      #boot-loader .boot-loader__label--es {
        display: none;
      }
      html[data-boot-lang='es'] #boot-loader .boot-loader__label:not(.boot-loader__label--es) {
        display: none;
      }
      html[data-boot-lang='es'] #boot-loader .boot-loader__label--es {
        display: block;
      }
      /* While the loader covers the viewport there is no #main to skip to, so
         keep the skip link out of the tab order instead of letting focus land
         on a control nobody can see. This rule disappears with the loader. */
      body:has(#boot-loader) .skip-link {
        display: none;
      }
      #boot-loader.boot-loader--leaving {
        opacity: 0;
        pointer-events: none;
      }
      /* The overlay must never become a dead end. Its removal lives in
         dismissBootLoader() (src/boot.ts, from App's mount effect), so anything
         that stops React from committing — a bundle that never arrives, an
         uncaught throw, JavaScript switched off — would otherwise leave a fixed
         overlay swallowing every click on top of an empty page. Both cases
         below are therefore driven from outside React. Font and colours
         duplicate src/index.css for the same reason the block above does:
         neither is guaranteed to be on the page at this point. */
      #boot-loader .boot-loader__lang {
        display: grid;
        justify-items: center;
        gap: 0.6rem;
        text-align: center;
      }
      #boot-loader .boot-loader__msg {
        margin: 0;
        width: min(22rem, 78vw);
        font-family: 'Sora', sans-serif;
        color: #121721;
      }
      html.dark #boot-loader .boot-loader__msg {
        color: #f1f5f9;
      }
      #boot-loader .boot-loader__retry {
        color: #147568;
        font-weight: 600;
      }
      html.dark #boot-loader .boot-loader__retry {
        color: #2dd4bf;
      }
      #boot-loader .boot-loader__retry:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 3px;
        border-radius: 2px;
      }
      /* Which half of the failure shows is decided by whole block rather than
         per element, so one language can never leak half of its copy. The
         resolved language already sits on <html>, published by the script in
         the head, so none of this needs a script of its own. */
      #boot-loader .boot-loader__failure,
      #boot-loader .boot-loader__failure-es {
        display: none;
      }
      #boot-loader.boot-loader--failed .boot-loader__failure {
        display: grid;
      }
      html[data-boot-lang='es'] #boot-loader .boot-loader__failure-en {
        display: none;
      }
      html[data-boot-lang='es'] #boot-loader .boot-loader__failure-es {
        display: grid;
      }
      /* Added by the script at the end of the body when the bundle fails. */
      #boot-loader.boot-loader--failed .boot-loader__bar,
      #boot-loader.boot-loader--failed .boot-loader__label {
        display: none;
      }
      /* JavaScript switched off: the app will never boot, so say so instead of
         animating a bar that cannot finish. The <noscript> copy needs no
         language rule of its own — the boot script did not run, so there is no
         language attribute, and both languages are rendered. Where this media
         query is not supported the bar keeps animating, exactly as it did
         before, and the messages below it still read. */
      @media (scripting: none) {
        #boot-loader .boot-loader__bar,
        #boot-loader .boot-loader__label {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader {
          transition: none;
        }
        #boot-loader .boot-loader__bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>

        <noscript>

    </div>

    <a href="#main" class="skip-link">Skip to content</a>
    <div id="root"></div>

    <!--
      The independent dismissal path for the overlay above. dismissBootLoader()
      lives in the bundle, so it cannot report its own absence: if the module
      never runs, nothing removes the overlay and the page is unreachable behind
      it. This runs before the deferred module, so it is already listening when
      that module fails.

      It reports two things, and only while #root is still empty:

        - a script that fails to load — resource error events do not bubble, so
          this needs capture. It is filtered to same-app code rather than to
          every <script>: the entry and every chunk are module scripts, while
          third-party ones are not, so a blocked analytics script (an ad
          blocker is enough) can never be reported as a boot failure;
        - an uncaught error or unhandled rejection from any script.

      The empty-#root guard is what keeps this honest: a slow boot, a lazy
      chunk, or any error after the app is on screen changes nothing. It is also
      not sticky — if React does mount afterwards, dismissBootLoader() removes
      the overlay as usual.

      Under a script-src that blocks inline scripts this never runs, and none of
      it is needed: the bundle then still loads and mounts on its own.
    -->
    <script>
      (function () {
        var loader = document.getElementById('boot-loader');

        function fail() {
          var root = document.getElementById('root');
          if (!loader || (root && root.children.length > 0)) return;
          loader.classList.add('boot-loader--failed');
        }

        function onError(event) {
          var target = event.target;
          // The app is all ESM, in dev and in the built output, so a failure of
          // its own code is a module script that never arrived. Classic scripts
          // on this page belong to analytics services; a blocked or 404ed one is
          // not a reason to tell the visitor the page did not load.
          var appScriptFailed =
            !!target &&
            target !== window &&
            target.tagName === 'SCRIPT' &&
            target.type === 'module';
          if (appScriptFailed || event instanceof ErrorEvent) fail();
        }

        window.addEventListener('error', onError, true);
        window.addEventListener('unhandledrejection', fail);

        /* href="" alone would be a same-document navigation whenever the URL
           already carries a fragment, i.e. a button that appears to do nothing,
           so the click is wired here. The href stays as the fallback. */
        loader.addEventListener('click', function (event) {
          var link = event.target.closest && event.target.closest('.boot-loader__retry');
          if (!link) return;
          event.preventDefault();
          location.reload();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
